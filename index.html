<title>The Functional Skin Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"/>
<style>
:root{
  --dk:#3d4435;--dk2:#4e5644;--dk3:#2d3328;
  --sg:#c3cbbe;--sg2:#dde1d8;--sg3:#edf0ea;
  --sd:#d6d2c4;--sd2:#e8e4d8;--sd3:#f4f2ed;
  --cr:#faf9f6;--wh:#ffffff;
  --tx:#2c2c2a;--mid:#5a5a54;--mu:#8a8a82;
  --bd:#dde1d8;--bd2:#edf0ea;
  --am:#b8752a;--am2:#fdf3e7;--am3:#e8c99a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:Poppins,sans-serif;background:var(--dk3);color:var(--tx);-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
#root{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:0;}
@media(min-width:500px){#root{padding:20px 16px 48px;}}
.device{width:100%;max-width:430px;min-height:100vh;background:var(--cr);position:relative;display:flex;flex-direction:column;}
@media(min-width:500px){.device{min-height:820px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #1a1f17,0 32px 80px rgba(0,0,0,.6);}}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* TOP BAR */
.tb{background:var(--dk);padding:env(safe-area-inset-top,14px) 16px 12px;padding-top:max(env(safe-area-inset-top),14px);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;}
.tb-logo{height:28px;width:auto;display:block;}
.tb-right{display:flex;gap:8px;align-items:center;}
.tb-name{font-size:11px;color:var(--sg);opacity:.85;font-weight:400;}
.tbn{background:rgba(195,203,190,.12);border:none;border-radius:8px;width:30px;height:30px;color:var(--sg);cursor:pointer;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;font-family:Poppins,sans-serif;}

/* PAGE HEADER — colour by section */
.ph{padding:12px 18px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.ph.dark{background:var(--dk);} .ph.sage{background:var(--sg2);} .ph.sand{background:var(--sd);}
.bk{border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:Poppins,sans-serif;flex-shrink:0;}
.ph.dark .bk{background:rgba(195,203,190,.14);color:var(--sg);}
.ph.sage .bk,.ph.sand .bk{background:rgba(61,68,53,.1);color:var(--dk);}
.ph-title{font-family:Lora,serif;font-size:15px;font-weight:500;}
.ph.dark .ph-title{color:var(--cr);} .ph.sage .ph-title,.ph.sand .ph-title{color:var(--dk);}

/* BOTTOM NAV */
.bnav{background:var(--wh);border-top:1px solid var(--bd);display:flex;padding:8px 0 max(env(safe-area-inset-bottom),18px);flex-shrink:0;}
.bnt{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;background:none;border:none;padding:4px 0;}
.bnt-dot{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px;transition:background .2s;}
.bnt.on .bnt-dot{background:var(--dk);}
.bnt-lbl{font-size:9px;font-weight:500;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;transition:color .2s;}
.bnt.on .bnt-lbl{color:var(--dk);}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{width:0;}
.ct{padding:16px 15px;display:flex;flex-direction:column;gap:12px;}

/* SECTION LABELS */
.sl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;}
.sl.dk{color:var(--dk);} .sl.sg{color:#3d6b3d;} .sl.sd{color:#7a6a50;}

/* CARDS */
.card{background:var(--wh);border-radius:14px;overflow:hidden;box-shadow:0 1px 10px rgba(61,68,53,.08);}
.card-p{padding:13px 15px;}
.ca{height:3px;} .ca.dk{background:var(--dk);} .ca.sg{background:var(--sg);} .ca.sd{background:var(--sd);}
.ir{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bd2);gap:10px;}
.ir:last-child{border-bottom:none;}
.il{font-size:10px;color:var(--mu);font-weight:500;flex-shrink:0;width:110px;}
.iv{font-size:11px;color:var(--tx);text-align:right;flex:1;line-height:1.45;}

/* ASSESS */
.assess{border-radius:13px;padding:13px 15px;box-shadow:0 1px 8px rgba(61,68,53,.07);}
.assess.dk{background:var(--wh);border-left:3px solid var(--dk);}
.assess.sg{background:#f0f4ee;border-left:3px solid var(--sg);}
.assess.sd{background:var(--sd3);border-left:3px solid var(--sd);}
.assess-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;margin-bottom:6px;display:block;}
.assess.dk .assess-lbl{color:var(--dk);} .assess.sg .assess-lbl{color:#3d6b3d;} .assess.sd .assess-lbl{color:#7a6a50;}
.assess-txt{font-size:12px;color:var(--tx);line-height:1.78;font-weight:300;}

/* MED BANNER */
.med{background:var(--am2);border:1px solid var(--am3);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;}
.med-txt{font-size:10px;color:var(--am);line-height:1.65;}

/* BADGES */
.badge{font-size:8px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase;}
.badge-dk{background:var(--dk);color:var(--sg);} .badge-sg{background:var(--sg2);color:var(--dk);} .badge-sd{background:var(--sd2);color:#5a4a30;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:Poppins,sans-serif;font-weight:600;border:none;cursor:pointer;border-radius:10px;transition:all .15s;letter-spacing:.03em;}
.btn-dk{background:var(--dk);color:var(--cr);font-size:12px;padding:11px 20px;}
.btn-sg{background:var(--sg2);color:var(--dk);font-size:11px;padding:9px 16px;}
.btn-ol{background:transparent;color:var(--dk);font-size:11px;padding:8px 15px;border:1.5px solid var(--dk);border-radius:9px;}
.btn-sm{font-size:9px;padding:5px 11px;border-radius:18px;}
.btn-full{width:100%;}

/* TOGGLE */
.sw{width:38px;height:22px;border-radius:11px;background:var(--bd);position:relative;transition:background .2s;cursor:pointer;flex-shrink:0;}
.sw.on{background:var(--dk);}
.sw-k{width:16px;height:16px;border-radius:50%;background:var(--wh);position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.sw.on .sw-k{left:19px;}

/* SPLASH */
#splash{min-height:100vh;background:var(--dk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:52px 30px;}
.sp-eye{font-size:9px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--sg);opacity:.8;}
.sp-title{font-family:Lora,serif;font-size:28px;font-weight:400;color:var(--cr);text-align:center;line-height:1.3;}
.sp-hint{font-size:9px;color:rgba(195,203,190,.4);text-align:center;line-height:1.7;max-width:200px;}

/* PIN */
.pin-lbl{font-size:9px;font-weight:600;color:var(--sg);letter-spacing:.18em;text-transform:uppercase;opacity:.75;}
.pin-dots{display:flex;gap:13px;}
.pin-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(195,203,190,.35);background:transparent;transition:all .18s;}
.pin-dot.fl{background:var(--sg);border-color:var(--sg);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:210px;}
.pin-btn{background:rgba(195,203,190,.07);border:1px solid rgba(195,203,190,.16);border-radius:12px;color:var(--cr);font-family:Poppins,sans-serif;font-size:20px;font-weight:300;padding:13px;cursor:pointer;}
.pin-btn:active{background:rgba(195,203,190,.22);}
.pin-err{font-size:10px;color:#e8b4aa;text-align:center;min-height:14px;}
.pin-back{font-size:10px;color:var(--sg);opacity:.6;background:none;border:none;cursor:pointer;text-decoration:underline;font-family:Poppins,sans-serif;}

/* DISCLAIMER */
.disc-hd{background:var(--dk);padding:28px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
.disc-t{font-family:Lora,serif;color:var(--cr);font-size:16px;font-weight:500;}
.disc-s{color:var(--sg);font-size:10px;font-weight:300;opacity:.85;}
.disc-card{background:var(--wh);border-radius:13px;padding:13px 15px;border-left:3px solid var(--dk);box-shadow:0 1px 6px rgba(61,68,53,.07);}
.disc-ct{font-family:Lora,serif;font-size:13px;font-weight:600;color:var(--tx);margin-bottom:5px;}
.disc-cx{font-size:10px;color:var(--mid);line-height:1.7;font-weight:300;}
.chk{display:flex;align-items:flex-start;gap:9px;background:var(--wh);border-radius:11px;padding:11px 13px;border:1.5px solid var(--bd);cursor:pointer;transition:border-color .2s,background .2s;}
.chk.on{border-color:var(--dk);background:#3d443510;}

async function dbGet(table, filters='') {
  const url = `${SUPABASE_URL}/rest/v1/${table}?${filters}`;
  const res = await fetch(url, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
    }
  });
  if (!res.ok) { console.error('DB GET error', await res.text()); return null; }
  return res.json();
}

async function dbPost(table, data) {
  const url = `${SUPABASE_URL}/rest/v1/${table}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    },
    body: JSON.stringify(data)
  });
  if (!res.ok) { console.error('DB POST error', await res.text()); return null; }
  return res.json();
}

async function dbPatch(table, filters, data) {
  const url = `${SUPABASE_URL}/rest/v1/${table}?${filters}`;
  const res = await fetch(url, {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    },
    body: JSON.stringify(data)
  });
  if (!res.ok) { console.error('DB PATCH error', await res.text()); return null; }
  return res.json();
}

// ── AUTH: Login therapist by PIN ──
async function loginTherapist(pin) {
  const rows = await dbGet('therapists', `pin=eq.${pin}&select=*`);
  return rows && rows.length > 0 ? rows[0] : null;
}

// ── AUTH: Login client by code ──
async function loginClient(code) {
  const rows = await dbGet('clients', `code=eq.${code}&select=*`);
  return rows && rows.length > 0 ? rows[0] : null;
}

// ── PLAN: Get plan for client ──
async function getPlan(clientId) {
  const rows = await dbGet('plans', `client_id=eq.${clientId}&select=*&order=updated_at.desc&limit=1`);
  return rows && rows.length > 0 ? rows[0] : null;
}

// ── PLAN: Save plan ──
async function savePlanToDB(clientId, therapistId, planData) {
  // Check if plan exists
  const existing = await getPlan(clientId);
  const payload = {
    client_id: clientId,
    last_updated_by: therapistId,
    updated_at: new Date().toISOString(),
    ...planData
  };
  if (existing) {
    return dbPatch('plans', `client_id=eq.${clientId}`, payload);
  } else {
    return dbPost('plans', payload);
  }
}

// ── NOTIFICATIONS: Send notification to client ──
async function sendNotification(clientId, message) {
  return dbPost('notifications', {
    client_id: clientId,
    message: message,
    read: false
  });
}

// ── NOTIFICATIONS: Get unread for client ──
async function getNotifications(clientId) {
  return dbGet('notifications', `client_id=eq.${clientId}&read=eq.false&select=*&order=created_at.desc`);
}

// ── NOTIFICATIONS: Mark as read ──
async function markNotificationsRead(clientId) {
  return dbPatch('notifications', `client_id=eq.${clientId}&read=eq.false`, {read: true});
}

// ── DISCLAIMER: Record acceptance ──
async function recordDisclaimer(clientId) {
  return dbPatch('clients', `id=eq.${clientId}`, {
    disclaimer_accepted: true,
    disclaimer_date: new Date().toISOString()
  });
}

// ── CLIENTS: Get all clients ──
async function getAllClients() {
  return dbGet('clients', 'select=*&order=name.asc');
}

// ── CLIENTS: Create new client ──
async function createClient(data) {
  // Generate unique 6-digit code
  const code = Math.floor(100000 + Math.random() * 900000).toString();
  return dbPost('clients', { ...data, code });
}

async function saveNewClient() {
  const name = document.getElementById('nc-name')?.value?.trim();
  if (!name) { alert('Please enter the client name.'); return; }
  const code = Math.floor(100000 + Math.random() * 900000).toString();
  const clientData = {
    code,
    name,
    email: document.getElementById('nc-email')?.value?.trim() || '',
    skin_type: document.getElementById('nc-skintype')?.value?.trim() || '',
    concerns: document.getElementById('nc-concerns')?.value?.trim() || '',
    med_history: document.getElementById('nc-medhist')?.value?.trim() || '',
    medications: document.getElementById('nc-meds')?.value?.trim() || '',
    allergies: document.getElementById('nc-allergies')?.value?.trim() || '',
    current_routine: document.getElementById('nc-routine')?.value?.trim() || '',
    disclaimer_accepted: false
  };
  try {
    const result = await dbPost('clients', clientData);
    if (result && result.length > 0) {
      closeModal('nc-modal');
      // Add to local clients list and refresh
      LOCAL_CLIENTS.push({...clientData, id: result[0].id});
      ss({tPage:'dashboard'});
      setTimeout(() => alert('Client created!\nAccess code: ' + code + '\n\nShare this code with ' + name + ' to access their plan.'), 300);
    } else {
      throw new Error('No result');
    }
  } catch(e) {
    // Offline fallback — save locally
    const localClient = {...clientData, id: 'local_' + Date.now()};
    LOCAL_CLIENTS.push(localClient);
    closeModal('nc-modal');
    ss({tPage:'dashboard'});
    setTimeout(() => alert('Client created locally!\nAccess code: ' + code + '\n\nShare this code with ' + name + ' to access their plan.\n\n(Will sync to database when online)'), 300);
  }
}

async function saveNewTherapist() {
  const name = document.getElementById('at-name')?.value?.trim();
  const pin = document.getElementById('at-pin')?.value?.trim();
  if (!name) { alert('Please enter the therapist name.'); return; }
  if (!pin || pin.length !== 4 || isNaN(pin)) { alert('Please enter a valid 4-digit PIN.'); return; }
  // Check PIN not already in use
  if (STAFF.find(s => s.pin === pin)) { alert('That PIN is already in use. Please choose a different one.'); return; }
  const role = document.getElementById('at-role')?.value || 'therapist';
  try {
    const result = await dbPost('therapists', { name, pin, role });
    if (result && result.length > 0) {
      STAFF.push({ name, pin, role, id: result[0].id });
      closeModal('at-modal');
      ss({tPage:'settings'});
      setTimeout(() => alert(name + ' has been added.\nPIN: ' + pin), 300);
    } else throw new Error('No result');
  } catch(e) {
    STAFF.push({ name, pin, role });
    closeModal('at-modal');
    ss({tPage:'settings'});
    setTimeout(() => alert(name + ' has been added.\nPIN: ' + pin + '\n(Will sync when online)'), 300);
  }
}

let pinVal='';
function renderPin(mode){
  const len=mode==='therapist'?4:6;
  return `<div id="splash">
    ${LogoMark(44)}
    <div class="sp-title" style="font-size:20px">${mode==='therapist'?'Therapist Login':'Welcome Back'}</div>

    <span class="pin-lbl">Enter ${len}-digit code</span>
    <div class="pin-dots">${Array.from({length:len}).map((_,i)=>`<div class="pin-dot ${i<pinVal.length?'fl':''}" id="pd${i}"></div>`).join('')}</div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="pin-btn" onclick="pressPin('${d}','${mode}',${len})">${d}</button>`).join('')}
      <button class="pin-btn" style="font-size:13px" onclick="delPin(${len})">del</button>
      <button class="pin-btn" onclick="pressPin('0','${mode}',${len})">0</button>
      <div></div>
    </div>
    <p class="pin-err" id="perr">&nbsp;</p>
    <button class="pin-back" onclick="ss({screen:'landing'})">Back</button>
  </div>`;
}
function pressPin(d,mode,len){
  pinVal=(pinVal+d).slice(0,len);
  document.querySelectorAll('.pin-dot').forEach((dot,i)=>dot.classList.toggle('fl',i<pinVal.length));
  const e=$('perr');if(e)e.innerHTML='&nbsp;';
  if(pinVal.length===len){
    setTimeout(()=>{
      if(mode==='therapist'){
        loginTherapist(pinVal).then(f => {
          if(f){pinVal='';ss({screen:'tapp',therapist:f,tPage:'dashboard'});}
          else{const e2=$('perr');if(e2)e2.textContent='Incorrect code. Please try again.';pinVal='';document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('fl'));}
        }).catch(()=>{
          // Fallback to local auth if offline
          const f=STAFF.find(s=>s.pin===pinVal);
          if(f){pinVal='';ss({screen:'tapp',therapist:f,tPage:'dashboard'});}
          else{const e2=$('perr');if(e2)e2.textContent='Incorrect code. Please try again.';pinVal='';document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('fl'));}
        });
      }else{
        loginClient(pinVal).then(c => {
          if(c){
            Object.assign(CLIENT, {
              id: c.id,
              code: c.code,
              name: c.name,
              firstName: c.name.split(' ')[0],
              email: c.email || '',
              skinType: c.skin_type || '',
              concerns: c.concerns || '',
              medHistory: c.med_history || '',
              medications: c.medications || '',
              supplements: c.supplements || '',
              allergies: c.allergies || '',
              currentRoutine: c.current_routine || '',
            });
            pinVal='';
            ss({screen:'disc',disc:{c1:false,c2:false}});
          } else {
            const e2=$('perr');if(e2)e2.textContent='Incorrect code. Please try again.';pinVal='';document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('fl'));
          }
        }).catch(()=>{
          // Fallback to local if offline
          if(pinVal===CLIENT.code){pinVal='';ss({screen:'disc',disc:{c1:false,c2:false}});}
          else{const e2=$('perr');if(e2)e2.textContent='Incorrect code. Please try again.';pinVal='';document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('fl'));}
        });
      }
    },200);
  }
}
function delPin(len){pinVal=pinVal.slice(0,-1);document.querySelectorAll('.pin-dot').forEach((d,i)=>d.classList.toggle('fl',i<pinVal.length));}

function savePlan(){
  const planData = {
    sections: pbSecs,
    am_routine: amRoutine.map(p=>({id:p.id,name:p.name,img:p.img,handle:p.handle,price:p.price})),
    pm_routine: pmRoutine.map(p=>({id:p.id,name:p.name,img:p.img,handle:p.handle,price:p.price})),

      const s=[...SKIN_SVCS,...INJ_SVCS].find(x=>x.id===id);

// Drag from product library to column
function dragProdStart(event,pid){
  dragItem={type:'prod',pid};
  event.dataTransfer.setData('text','prod:'+pid);
}
// Drag within routine to reorder
function dragStart(event,col,idx){
  dragItem={type:'routine',col,idx};
  event.dataTransfer.setData('text','routine:'+col+':'+idx);
}
function dropToRoutine(event,col){
  event.preventDefault();
  $('drop-'+col)?.classList.remove('drag-over');
  const data=event.dataTransfer.getData('text');
  if(data.startsWith('prod:')){
    const pid=data.split(':')[1];
    const prod=TFS_PRODUCTS.find(p=>p.id===pid);
    if(!prod)return;
    if(col==='am'&&!amRoutine.find(p=>p.id===pid)) amRoutine.push(prod);
    if(col==='pm'&&!pmRoutine.find(p=>p.id===pid)) pmRoutine.push(prod);
  } else if(data.startsWith('routine:')){
    const[,srcCol,srcIdx]=data.split(':');
    const srcArr=srcCol==='am'?amRoutine:pmRoutine;
    const item=srcArr.splice(parseInt(srcIdx),1)[0];
    if(col==='am') amRoutine.push(item);
    else pmRoutine.push(item);
  }
  const el=$('pbc');if(el){el.innerHTML=renderPBContent();attachDrag();}
}
function quickAddToRoutine(pid,col){
  const prod=TFS_PRODUCTS.find(p=>p.id===pid);if(!prod)return;
  if(col==='am'){
    const idx=amRoutine.findIndex(p=>p.id===pid);
    if(idx>-1) amRoutine.splice(idx,1); else amRoutine.push(prod);
  } else {
    const idx=pmRoutine.findIndex(p=>p.id===pid);
    if(idx>-1) pmRoutine.splice(idx,1); else pmRoutine.push(prod);
  }
  const el=$('pbc');if(el){el.innerHTML=renderPBContent();attachDrag();}
}
function removeFromRoutine(col,idx){
  if(col==='am') amRoutine.splice(idx,1); else pmRoutine.splice(idx,1);
  const el=$('pbc');if(el){el.innerHTML=renderPBContent();attachDrag();}
}

}

          <button style="margin-top:6px;width:100%;font-size:8px;font-weight:700;padding:5px;border-radius:6px;border:none;cursor:pointer;background:${selSupps.includes(p.id)?'var(--dk)':'var(--sg2)'};color:${selSupps.includes(p.id)?'var(--cr)':'var(--dk)'};font-family:Poppins,sans-serif">${selSupps.includes(p.id)?'✓ Added':'+  Add'}</button>
        </div>
      </div>`).join('')}
  </div>
  ${selSupps.length>0?`<div style="background:var(--sg2);border-radius:11px;padding:11px 13px;margin-top:2px"><div style="font-size:9px;font-weight:700;color:var(--dk);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">${selSupps.length} Supplement${selSupps.length!==1?'s':''} Selected</div>${selSupps.map(id=>{const p=SUPP_PRODUCTS.find(x=>x.id===id);return p?`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(61,68,53,.1)"><span style="font-size:10px;color:var(--dk);font-weight:500">${p.name}</span><button onclick="event.stopPropagation();toggleSupp('${p.id}')" style="background:none;border:none;color:var(--mu);cursor:pointer;font-size:12px;padding:0 2px">✕</button></div>`:''}).join('')}</div>`:''}`;
}

function toggleSupp(id) {
  const i = selSupps.indexOf(id);
  if (i > -1) selSupps.splice(i, 1);
  else selSupps.push(id);
  const el = document.getElementById('pbc');
  if (el) el.innerHTML = renderPBContent();
}

function renderPBS5(){
  const nut=['Increase leafy greens daily','Increase oily fish 2-3x weekly','Increase daily water to 2.5L minimum','Reduce refined sugar intake','Reduce dairy consumption','Include probiotic-rich foods daily'];

function togglePathology() {
  includePathology = !includePathology;

}

function renderPBS6(){
  const active=Object.entries(pbSecs).filter(([,v])=>v).map(([k])=>k);
  const labels={homecare:'Home Care Routine',inclinic:'In-Clinic Treatments',supplements:'Supplement Plan',nutrition:'Nutrition Guidance',lifestyle:'Lifestyle Recommendations'};
  return `<div class="pb-hdr dk"><div class="pb-ey">Step 7 of 7</div><div class="pb-tt">Review and Save</div><div class="pb-sb">Once saved, Clancy will receive an in-app notification that their plan has been updated.</div></div>

    ${active.map(k=>`<div class="ir"><span class="il">${labels[k]}</span><span class="iv" style="font-weight:600;color:var(--dk)">Included</span></div>`).join('')}
